summary: >
  Data scientist con oltre 10 anni di esperienza e una formazione accademica in matematica.
  Ho iniziato in Sisal, sviluppando modelli matematici per lotterie e scommesse, e ho poi ampliato
  il mio lavoro alla consulenza di data science, allo sviluppo backend e all'infrastruttura cloud.
  Per 5 anni ho lavorato in due startup del settore calcistico su soluzioni dati end-to-end per
  analisi tattiche e scouting, dai modelli predittivi al deployment in cloud. Dal 2025 lavoro come
  freelance su progetti di data science per clienti di settori diversi. Mi interessano sport-tech,
  energia, sanità, immobiliare, turismo e aerospazio, con l'obiettivo di applicare l'AI in modo
  etico e sostenibile.
  <br>
  Oltre al lavoro sui dati, gestisco con mia moglie [Selos Design](https://selosdesign.com), uno
  studio di interior design: un'esperienza che mi ha insegnato a seguire clienti e scadenze e a
  gestire una piccola attività dall'inizio alla fine.
